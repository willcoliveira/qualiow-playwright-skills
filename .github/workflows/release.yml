name: Release

# A v* tag publishes that commit to npm through trusted publishing. GitHub
# mints an OIDC token for this run, npm checks it against the trusted
# publisher registered on the package, and provenance is attached. No token
# is stored anywhere and no one-time code is involved; prepublishOnly still
# runs lint, the tests, the fence check and the build before anything ships.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or newer, which Node 24 bundles.
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never restore a cache into a release build.
          package-manager-cache: false

      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: npm is new enough for trusted publishing
        run: |
          required=11.5.1
          have="$(npm --version)"
          if [ "$(printf '%s\n' "$required" "$have" | sort -V | head -n 1)" != "$required" ]; then
            echo "npm $have is older than $required"
            exit 1
          fi

      - run: npm ci

      # prepublishOnly runs lint, test, check:fences and build.
      - run: npm publish

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test CLI
        run: |
          node dist/bin/init.js --version
          node dist/bin/init.js --help

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Generated output
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map(f => f.path)
            const required = ["dist/bin/init.js", "skills/indexes/skill.md", "skills/core/agent-debugging.md", "skills/templates/test-generation.md", "skills/core/conventions.md", "skills/core/workflow.md", "skills/rules.manifest.tsv", "skills/core/delegation-rules.md", "skills/workflows/playwright-plan.md", "skills/agents/pw-page-mapper.md"]
            const missing = required.filter(f => !files.includes(f))
            const vendored = files.filter(f => f.startsWith("skills/playwright-cli/"))
            if (missing.length) { console.error("missing from package:", missing); process.exit(1) }
            if (vendored.length) { console.error("vendored playwright-cli must not ship:", vendored); process.exit(1) }
            console.log(`package ok: ${files.length} files`)
          '

      - name: Generate into a scratch project (non-interactive)
        run: |
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj"
          npm init -y > /dev/null
          node "$GITHUB_WORKSPACE/dist/bin/init.js" init \
            --platforms claude,cursor,copilot,agents \
            --packs core,templates,playwright-cli \
            --project-name scratch-e2e --base-url https://staging.example.com \
            --yes
          find . -type f -not -path './node_modules/*' | sort

      - name: Validate generated output
        run: npx tsx scripts/validate-output.ts "$RUNNER_TEMP/proj"

      - name: No rule drift
        run: npx tsx scripts/check-rule-drift.ts "$RUNNER_TEMP/proj"

      # The minimal install is where a rule stated in a platform summary but
      # owned by an unselected pack shows up, and it is the only path that
      # exercises resolveSkillsDir walking up from dist/bin/ in the packed
      # layout. The in-process matrix covers neither.
      - name: Generate the pruned variant
        run: |
          mkdir -p "$RUNNER_TEMP/proj-min" && cd "$RUNNER_TEMP/proj-min"
          npm init -y > /dev/null
          node "$GITHUB_WORKSPACE/dist/bin/init.js" init \
            --platforms claude --packs core \
            --project-name pruned-e2e --yes
          test -f .claude/skills/playwright-e2e/references/conventions.md
          test -f .claude/skills/playwright-e2e/references/workflow.md
          test ! -f .claude/skills/playwright-e2e/references/project-conventions.md
          find . -type f -not -path './node_modules/*' | sort

      - name: Validate the pruned variant
        run: |
          npx tsx scripts/validate-output.ts "$RUNNER_TEMP/proj-min"
          npx tsx scripts/check-rule-drift.ts "$RUNNER_TEMP/proj-min"

      # The parity claim is that all four targets get the same procedure. The
      # in-process suite asserts it; this asserts it for the packed tarball, and
      # asserts every wrapper points at a body that was actually written.
      - name: Generate the workflows variant
        run: |
          mkdir -p "$RUNNER_TEMP/proj-wf" && cd "$RUNNER_TEMP/proj-wf"
          npm init -y > /dev/null
          node "$GITHUB_WORKSPACE/dist/bin/init.js" init \
            --platforms claude,cursor,copilot,agents \
            --packs core,templates,workflows \
            --project-name workflows-e2e --yes
          diff -r .claude/skills/playwright-e2e/workflows .agents/skills/playwright-e2e/workflows
          for f in .claude/commands/*.md .cursor/commands/*.md .github/prompts/*.prompt.md; do
            body=$(grep -o '`[^`]*/workflows/[^`]*\.md`' "$f" | head -1 | tr -d '`')
            test -n "$body" || { echo "$f names no workflow body"; exit 1; }
            test -f "$body" || { echo "$f points at $body, which was not generated"; exit 1; }
          done
          test -f .claude/agents/pw-page-mapper.md

      - name: Validate the workflows variant
        run: |
          npx tsx scripts/validate-output.ts "$RUNNER_TEMP/proj-wf"
          npx tsx scripts/check-rule-drift.ts "$RUNNER_TEMP/proj-wf"

      - name: Re-run is idempotent
        run: |
          cd "$RUNNER_TEMP/proj"
          node "$GITHUB_WORKSPACE/dist/bin/init.js" init \
            --platforms claude,cursor,copilot,agents \
            --packs core,templates,playwright-cli \
            --project-name scratch-e2e --base-url https://staging.example.com \
            --yes | tee rerun.log
          grep -q "Already up to date" rerun.log

      - name: Overwrite protection and dry run
        run: |
          cd "$RUNNER_TEMP/proj"
          echo "# edited" > .claude/skills/playwright-e2e/references/playwright-patterns.md
          if node "$GITHUB_WORKSPACE/dist/bin/init.js" init --platforms claude --project-name scratch-e2e --yes; then
            echo "expected a non-zero exit without --force"; exit 1
          fi
          node "$GITHUB_WORKSPACE/dist/bin/init.js" init --platforms claude --project-name scratch-e2e --dry-run --yes
          test "$(cat .claude/skills/playwright-e2e/references/playwright-patterns.md)" = "# edited"
          node "$GITHUB_WORKSPACE/dist/bin/init.js" init --platforms claude --project-name scratch-e2e --yes --force
          npx tsx "$GITHUB_WORKSPACE/scripts/validate-output.ts" "$RUNNER_TEMP/proj"
